name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: managy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # github.com/circlexo/circlexo-go is private. The secret CIRCLEXO_GO_TOKEN (a read-only token
      # for that repo) is optional here: without it this step does nothing.
      - name: Private module access (circlexo-go)
        env:
          CIRCLEXO_GO_TOKEN: ${{ secrets.CIRCLEXO_GO_TOKEN }}
        run: |
          echo "GOPRIVATE=github.com/circlexo/*" >> "$GITHUB_ENV"
          if [ -n "$CIRCLEXO_GO_TOKEN" ]; then
            git config --global url."https://x-access-token:${CIRCLEXO_GO_TOKEN}@github.com/circlexo/".insteadOf "https://github.com/circlexo/"
          fi
      - name: Codegen (sqlc + gqlgen)
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          go run github.com/99designs/gqlgen generate
      - name: OpenAPI export (integration gate — compiles everything)
        run: go run ./cmd/api openapi > openapi.yaml
      # apps/ needs this spec to check its generated types, but producing it requires the
      # sqlc/gqlgen output generated above. Hand it over instead of regenerating it there.
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.yaml
      - name: Vet
        run: go vet ./...
      - name: Unit tests + guards (MCP scopes, sqlc tenant predicate, authz)
        run: go test -count=1 ./...
      - name: Cross-workspace isolation sweep
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/managy_test?sslmode=disable
          TEST_APP_DATABASE_URL: postgres://managy_app_test:test@localhost:5432/managy_test?sslmode=disable
        run: go test -count=1 ./internal/server/ -run Isolation -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      # grid:check needs the fadymondy.com-v2 checkout (packages/sync-grid.mjs); run it locally
      # with `make grid-check` until the grid is published as a package.

  apps:
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (shared, tray, extension workspaces)
        working-directory: apps
        run: npm ci
      - name: Typecheck every workspace
        working-directory: apps
        run: npm run typecheck
      - name: Client tests
        working-directory: apps
        run: npm test -w @mahaam/client
      - name: Tray builds (needs no display)
        working-directory: apps
        run: npm run build -w @mahaam/tray
      # The checked-in openapi.d.ts silently lagged the API for days because generation
      # needed a running server. It now comes from `go run ./cmd/api openapi`, so drift
      # can be a hard failure instead of something nobody notices.
      - uses: actions/download-artifact@v4
        with:
          name: openapi-spec
      - name: API types are current
        working-directory: apps
        env:
          MAHAAM_OPENAPI: ${{ github.workspace }}/openapi.yaml
        run: |
          npm run gen:types
          git diff --exit-code -- shared/src/openapi.d.ts \
            || { echo '::error::openapi.d.ts is stale — run `npm run gen:types` in apps/ and commit the result'; exit 1; }

  mobile:
    runs-on: ubuntu-latest
    needs: api
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # apps/mobile is deliberately outside the apps/ npm workspace (its own lockfile),
      # so it needs its own job or it is never checked at all.
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: apps/mobile
      # Its API types are derived from the spec rather than hand-written, so a field renamed
      # server-side must fail here instead of surfacing as undefined on a phone.
      - name: API types are current
        env:
          MAHAAM_OPENAPI: openapi.yaml
        run: |
          npm run gen:types
          git diff --exit-code -- src/api/openapi.d.ts \
            || { echo '::error::apps/mobile/src/api/openapi.d.ts is stale — run `npm run gen:types` there and commit it'; exit 1; }
      - run: npx tsc --noEmit
      - run: npx jest --ci

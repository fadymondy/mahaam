# Mahaam PRODUCTION on a single container host. Images are built elsewhere and
# loaded via `docker load` (no registry auth needed).
# A reverse proxy in front forwards the public host (e.g. console.mahaam.app) -> <host>:3010 (web).
# web (next start) proxies /api,/graphql,/embed to the api container.
name: mahaam-prod
services:
  api:
    image: mahaam-api
    container_name: mahaam-api
    volumes:
      # Attachments, feedback screenshots and mail (.eml) — STORAGE_DIR=storage under /app.
      # A named volume, so a redeploy (force-recreate) never loses uploaded files.
      - mahaam-storage:/app/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8110/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    env_file: .env.prod
    ports:
      # The API is reached through the web container (/api, /graphql, /embed, MCP); only loopback here.
      - "127.0.0.1:8110:8110"
    restart: unless-stopped
  web:
    image: mahaam-web
    container_name: mahaam-web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3010/en/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:8110
    ports:
      - "0.0.0.0:3010:3010"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mahaam-storage:

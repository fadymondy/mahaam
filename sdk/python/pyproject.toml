[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mahaam-feedback"
version = "0.1.0"
description = "Mahaam Feedback widget: script tag, server-side report(), Django and Flask helpers. Stdlib only."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
django = ["django>=3.2"]
flask = ["flask>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Mahaam</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e6e6e6; --action: #8c3fb5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0f10; --fg: #f5f5f5; --muted: #9a9a9a; --line: #262626; --action: #b784d6; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; -webkit-user-select: none; }
  .bar { height: 56px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; }
  .card { max-width: 380px; border: 1px solid var(--line); padding: 28px; }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 20px; }
  button { font: inherit; border: 0; border-radius: 6px; padding: 8px 16px; background: var(--action); color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div class="bar"></div>
<main><div class="card">
  <h1 id="t">Can't reach Mahaam</h1>
  <p id="b">Check your connection. The app will try again when you're back online.</p>
  <button id="r">Try again</button>
</div></main>
<script>
  const q = new URLSearchParams(location.search);
  const url = q.get("url") || "";
  if (q.get("locale") === "ar") {
    document.documentElement.dir = "rtl"; document.documentElement.lang = "ar";
    t.textContent = "تعذّر الوصول إلى مهام";
    b.textContent = "تحقّق من اتصالك. سيحاول التطبيق مرة أخرى عند عودة الاتصال.";
    r.textContent = "حاول مرة أخرى";
  }
  const retry = () => window.mahaamDesktop && window.mahaamDesktop.retry(url);
  r.onclick = retry;
  window.addEventListener("online", retry);
</script>
</body>
</html>
